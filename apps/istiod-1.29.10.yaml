apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod-1-29-10
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.29.10
